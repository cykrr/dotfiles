Section "InputClass"
    Identifier "MacBook Touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    
    # Enable tap-to-click
    Option "Tapping" "on"
    
    # Two fingers for right-click, three fingers for middle-click.
    # This is superior to "buttonareas" for Apple's seamless glass trackpads.
    Option "ClickMethod" "clickfinger"
    
    # Smooth two-finger scrolling
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "true" 
    
    # Palm detection/disable tap while typing
    Option "DisableWhileTyping" "true"
    
    # Smooth out pointer acceleration
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.2"
EndSection
